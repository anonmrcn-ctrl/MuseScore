name: Graphical review checks
on:
  push:
    branches: [codex/graphical-review]
  pull_request:
    paths:
      - 'src/notationscene/qml/MuseScore/NotationScene/*Review*'
      - 'src/notationscene/qml/MuseScore/NotationScene/scorereviewbridge.cpp'
      - 'buildscripts/review/**'
      - '.github/workflows/review_checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PySide6==6.8.3
      - run: node buildscripts/review/tests/test_document.mjs
      - run: pyside6-qmllint src/notationscene/qml/MuseScore/NotationScene/ScoreReviewOverlay.qml
      - run: python buildscripts/review/tests/test_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
  windows_portable:
    if: github.event_name != 'pull_request'
    needs: review
    uses: ./.github/workflows/build_windows.yml
    with:
      platforms: windows_portable
      build_mode: devel
      publish: 'off'
      dockwidgets_v2: 'ON'
